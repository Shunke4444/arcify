<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Tab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
    <style>
        .varela-round-regular {
            font-family: "Varela Round", sans-serif;
            font-weight: 400;
            font-style: normal;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: "Varela Round", sans-serif;
            font-style: normal;
        }
    </style>
    <link rel="stylesheet" href="newtab.css">
</head>

<body>
    <div id="spotlight-container"></div>
    <script type="module" src="newtab.js"></script>
    <!-- The rail as a plain script, not a content script.
         Content scripts never run on chrome-extension:// pages, and this page IS one - it
         is the newtab override - so Ctrl+T landed on the one page in the browser with no
         rail at all. Included directly it runs in the extension's own context, where the
         chrome.* APIs it needs are available anyway. -->
    <script src="../rail/rail.js"></script>
</body>

</html>
